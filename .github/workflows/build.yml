name: build-package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Run the upstream bump check now (normally schedule-only)"
        type: boolean
        default: false
  schedule:
    # check every 2 hours for new upstream tags (release cadence is ~weekly)
    - cron: '23 */2 * * *'
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs needing more declare it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Schedule: detect new upstream release -> open auto-merge PR (never commits
  # to main directly). Build/smoke/release/aur-sync are triggered by the PR
  # checks and the push that follows the merge.
  # ---------------------------------------------------------------------------
  bump:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.bump)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
      # gh pr create / gh pr merge --auto need this; a job-level permissions
      # block sets every unlisted scope to none.
      pull-requests: write
    steps:
      - name: Install toolchain (makepkg needed for .SRCINFO regeneration)
        run: pacman -Syu --noconfirm --needed base-devel git github-cli python curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump PKGBUILD + aur/ and open auto-merge PR
        env:
          # Prefer the BUMP_TOKEN PAT over the workflow token. A PR opened with
          # GITHUB_TOKEN is authored by github-actions[bot], and GitHub then
          # holds its pull_request runs in "action_required" (nothing runs until
          # a human approves) — and the merge auto-merge performs afterwards is
          # token-attributed, so the follow-up push run never fires and
          # release/aur-sync silently never run. With a PAT the PR is
          # user-authored, checks run on their own and the merge triggers the
          # push pipeline. Falls back to the workflow token when unset.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and the bump regenerates
          # aur/.SRCINFO with it, so the whole script runs as an unprivileged
          # user — same pattern as the build job.
          useradd -m bumper
          chown -R bumper:bumper "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          runuser -u bumper -- env HOME=/home/bumper \
            GH_TOKEN="$GH_TOKEN" GH_REPO="$GH_REPO" \
            python3 scripts/bump-pkgbuild.py --pr

  # ---------------------------------------------------------------------------
  # Build + smoke: run for PRs (merge gate), pushes to main (after merge) and
  # manual dispatch. Never on schedule (bump job handles that).
  # ---------------------------------------------------------------------------
  build:
    # not on schedule; also skipped when a manual dispatch only runs the bump
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.bump)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build toolchain (Arch container)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl \
            nodejs npm uv rsync \
            ripgrep ffmpeg nss atk at-spi2-core cups libdrm libxkbcommon \
            mesa pango cairo alsa-lib

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate aur/.SRCINFO matches aur/PKGBUILD
        run: |
          useradd -m validator
          chown -R validator:validator "$GITHUB_WORKSPACE"
          runuser -u validator -- sh -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo | diff -q - .SRCINFO'

      - name: Build package (non-root makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg -f --noconfirm

      - name: Show result
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:latest
    steps:
      - name: Install runtime deps
        run: |
          pacman -Syu --noconfirm --needed \
            nodejs uv ripgrep ffmpeg git curl \
            nss atk at-spi2-core cups libdrm libxkbcommon mesa pango cairo alsa-lib

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Install built package (no compile happens here)
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst

      - name: Import + CLI smoke test
        run: |
          set -euo pipefail
          /opt/hermes-agent/venv/bin/python -c 'import hermes_cli.main; print("IMPORT-OK")'
          hermes --help > /tmp/hermes-help.log 2>&1
          echo "SMOKE-OK: hermes --help exited 0"

  # ---------------------------------------------------------------------------
  # Release + AUR sync: only after a merge to main or manual dispatch
  # (never from pull_request — no secrets/releases on untrusted code).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" "$FILE" \
              --title "hermes-agent-bin ${PKGVER}-${PKGREL}" \
              --notes "Prebuilt Arch package from upstream source tag ${UPSTREAM}"
            echo "Release created: $TAG"
          fi

  aur-sync:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute release artifact sha256 and pin it into aur/
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          FILE="hermes-agent-bin-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          URL="https://github.com/${{ github.repository }}/releases/download/v${PKGVER}-${PKGREL}/${FILE}"
          curl -fsSL -o /tmp/pkg.pkg.tar.zst "$URL"
          SHA=$(sha256sum /tmp/pkg.pkg.tar.zst | cut -d' ' -f1)
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${SHA}\2|" aur/PKGBUILD
          sed -i -E "s|^([[:space:]]*sha256sums = )[0-9a-f]{64}|\1${SHA}|" aur/.SRCINFO
          echo "artifact sha256=${SHA}"

      - name: Push aur/ to AUR git (publish)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ci && chmod 600 ~/.ssh/aur_ci
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name "hermes-agent-bin CI"
          git config --global user.email "jabla@users.noreply.github.com"
          rm -rf /tmp/aur
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes" \
            git clone ssh://aur@aur.archlinux.org/hermes-agent-bin.git /tmp/aur
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          # Stage first: git diff alone ignores untracked files, so a fresh
          # (empty) AUR repo would falsely report "nothing to push" and never
          # create the initial commit.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package up to date, nothing to push"
          else
            git commit -m "Update to ${PKGVER}-${PKGREL}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes" \
              git push origin master
            echo "AUR updated to ${PKGVER}-${PKGREL}"
          fi
