name: build-package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump PKGBUILD to the latest upstream release and open a PR"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs needing more declare it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Manual dispatch with "bump": move PKGBUILD to the latest upstream release
  # and open an auto-merge PR (never commits to main directly). Build/smoke/
  # release/aur-sync are triggered by the PR checks and the push that follows
  # the merge. There is no schedule: a new upstream release needs thorough
  # testing before it is packaged, so a maintainer starts the bump after
  # reading the release.
  # ---------------------------------------------------------------------------
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    permissions:
      contents: write
      # gh pr create / gh pr merge --auto need this; a job-level permissions
      # block sets every unlisted scope to none.
      pull-requests: write
    steps:
      # Retried: a mirror flake would otherwise fail the bump.
      - name: Install toolchain (makepkg needed for .SRCINFO regeneration)
        run: |
          for i in 1 2 3; do
            pacman -Syu --noconfirm --needed base-devel git github-cli python curl && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::pacman failed (attempt $i of 3), retrying in 30 s"
              sleep 30
            fi
          done
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bump pushes with BUMP_TOKEN in the push URL. A persisted
          # workflow token (an auth header for github.com) would take
          # precedence and push as github-actions[bot] instead.
          persist-credentials: false

      # Fail loudly when the PAT is missing or no longer valid: the run then
      # aborts here instead of opening a PR nobody can auto-merge. The workflow
      # token is no fallback — a PR opened with it is bot-authored, its checks
      # need manual approval and its merge never triggers the release pipeline.
      - name: Check the bump token
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BUMP_TOKEN secret is not set — store a fine-grained PAT (Contents + Pull requests: read/write) with: gh secret set BUMP_TOKEN"
            exit 1
          fi
          if ! login=$(gh api /user --jq .login 2>&1); then
            echo "::error::GitHub rejects BUMP_TOKEN (revoked?): $login"
            exit 1
          fi
          echo "bump token identity: $login"

      - name: Bump PKGBUILD + aur/ and open auto-merge PR
        env:
          # The BUMP_TOKEN PAT, never the workflow token (see the check above).
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Only for the script's read-only GitHub API calls (upstream release
          # and tag): unauthenticated calls share 60/hour per runner IP and
          # fail with "HTTP Error 403: rate limit exceeded".
          UPSTREAM_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and the bump regenerates
          # aur/.SRCINFO with it, so the whole script runs as an unprivileged
          # user — same pattern as the build job.
          useradd -m bumper
          chown -R bumper:bumper "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          runuser -u bumper -- env HOME=/home/bumper \
            GH_TOKEN="$GH_TOKEN" GH_REPO="$GH_REPO" \
            UPSTREAM_API_TOKEN="$UPSTREAM_API_TOKEN" \
            python3 scripts/bump-pkgbuild.py --pr

  # ---------------------------------------------------------------------------
  # Build + smoke: run for PRs (merge gate), pushes to main (after merge) and
  # manual dispatch.
  # A push whose pkgver-pkgrel is already released (CI, scripts, docs) skips
  # them: its PR run built and smoked the change, and release would skip.
  # ---------------------------------------------------------------------------
  plan:
    # Skipped when a manual dispatch only runs the bump. This also keeps
    # build, smoke and release off those runs: build only runs when plan was
    # not skipped.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bump) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Check whether the pushed version is released already
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # PKGBUILD of the pushed commit, read without a checkout.
          if ! pkgbuild=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/PKGBUILD?ref=${GITHUB_SHA}"); then
            echo "::warning::could not read PKGBUILD at ${GITHUB_SHA}: building"
            echo released=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKGVER=$(grep -oP '(?<=^pkgver=).*' <<<"$pkgbuild")
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' <<<"$pkgbuild")
          TAG="v${PKGVER}-${PKGREL}"
          # A failed lookup counts as not released: build as before.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: skipping build, smoke and release"
            echo released=true >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG not found: building"
            echo released=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    # Skip only when plan reported an existing release. A failed plan must not
    # skip build and smoke: skipped required checks count as passed.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && needs.plan.outputs.released != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    outputs:
      # The upstream commit the package is built from, for smoke's version check.
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - name: Install base toolchain (Arch container)
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned upstream commit
        id: upstream
        run: echo "commit=$(sed -nE 's/^_commit=([0-9a-f]{40})$/\1/p' PKGBUILD)" >> "$GITHUB_OUTPUT"

      - name: Validate aur/.SRCINFO and the wrapper's metadata
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo | diff -q - .SRCINFO'
          runuser -u builder -- bash "$GITHUB_WORKSPACE/scripts/check-metadata.sh"

      - name: Install dependencies declared in PKGBUILD
        run: |
          # Read them from PKGBUILD itself, so CI installs exactly what
          # makepkg -s would and cannot drift from a hand-kept list.
          cd "$GITHUB_WORKSPACE"
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo |
            sed -nE 's/^\t(depends|makedepends|checkdepends) = //p')
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: Build package (non-root makepkg)
        run: |
          cd "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg -f --noconfirm

      - name: Show result
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      # AUR users install aur/PKGBUILD re-wrapping this artifact, not the
      # artifact itself, so build the wrapper from it the way their makepkg
      # does (the file in place of the download) and compare the payloads.
      - name: Build the AUR wrapper from this artifact
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact=$(ls hermes-agent-bin-*-x86_64.pkg.tar.zst)
          prebuilt=$(sed -nE 's/^\tnoextract = //p' aur/.SRCINFO)
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          work=$(mktemp -d)
          cp aur/PKGBUILD "$work/"
          cp "$artifact" "$work/$prebuilt"
          # Pin the artifact's sha the way aur-sync does for the release.
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${sha}\2|" "$work/PKGBUILD"
          grep -qx "sha256sums=('${sha}')" "$work/PKGBUILD"
          chown -R builder:builder "$work"
          # Twice: a rebuild must still find the download intact. A wrapper
          # whose download is named like its own output overwrites it.
          runuser -u builder -- sh -c 'cd "$1" && makepkg -f --noconfirm && makepkg -f --noconfirm' sh "$work"
          # Same files, modes, links and sha256 digests as the artifact;
          # only mtimes and the package metadata differ.
          manifest() {
            bsdtar -xOf "$1" .MTREE | gzip -dc |
              grep -vE '^\./\.(BUILDINFO|PKGINFO) ' | sed -E 's/ time=[0-9.]+//'
          }
          if ! diff -u <(manifest "$artifact") <(manifest "$work/$artifact") > /tmp/wrapper.diff; then
            echo "::error::the AUR wrapper does not install the artifact's payload unchanged"
            head -n 60 /tmp/wrapper.diff
            exit 1
          fi
          echo "WRAPPER-OK: aur/PKGBUILD reproduces the artifact's payload ($(manifest "$artifact" | wc -l) manifest lines)"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          # Only smoke and release of this run need it; the release keeps the file.
          retention-days: 3

  smoke:
    runs-on: ubuntu-latest
    needs: build
    # Explicit, or a failed plan would skip it despite a green build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      # Runtime dependencies are deliberately not preinstalled: pacman -U has
      # to resolve them from the package's own depends=().
      - name: Sync the package databases
        run: pacman -Syu --noconfirm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Install built package (no compile happens here)
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst

      - name: Import + CLI smoke test
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          py=/opt/hermes-agent/venv/bin/python
          "$py" -c 'import hermes_cli.main; print("IMPORT-OK")'
          # The venv must run on Arch's python that depends=() pulled in, not
          # on an interpreter of the build host (no such path here).
          base=$("$py" -c 'import sys; print(sys.base_prefix)')
          if [ "$base" != /usr ]; then
            echo "SMOKE-FAIL: the venv's base_prefix is $base, not /usr"
            exit 1
          fi
          # Since v0.21.6 the version comes from the install stamp written in
          # package(). Check what users see: `hermes --version` reads the stamp
          # through upstream's version_info, which ignores a stamp with an
          # unusable commit and then prints "vunknown".
          if [ "${#COMMIT}" -ne 40 ]; then
            echo "SMOKE-FAIL: build passed no upstream commit ('$COMMIT')"
            exit 1
          fi
          pkgver=$(pacman -Q hermes-agent-bin | cut -d' ' -f2)
          pkgver=${pkgver%-*}
          version=$(hermes --version 2>&1)
          version=${version%%$'\n'*}   # first line; no pipe to head under pipefail
          # The date is the stamp's commitDate (release-date-from-stamp.patch),
          # not upstream's stale literal.
          date=$("$py" -c 'import datetime as d, json; t = d.datetime.fromtimestamp(json.load(open("/opt/hermes-agent/install-stamp.json"))["commitDate"], d.UTC); print(f"{t.year}.{t.month}.{t.day}")')
          case "$version" in
            "Hermes Agent v${pkgver} (${date}) "*"upstream ${COMMIT:0:8}"*) ;;
            *)
              echo "SMOKE-FAIL: hermes --version says '$version', expected v${pkgver} (${date}) from upstream ${COMMIT:0:8}"
              exit 1
              ;;
          esac
          # The stamp names pacman as the steward: `hermes update` must refuse
          # with that, not try to lock or sync the root-owned tree.
          rc=0
          update=$(hermes update --check 2>&1) || rc=$?
          if [ "$rc" -ne 2 ] || ! grep -q "managed by pacman" <<<"$update"; then
            echo "SMOKE-FAIL: hermes update --check exited $rc without the pacman refusal:"
            echo "$update"
            exit 1
          fi
          # Everything under /opt must be readable for users who are not root.
          unreadable=$(find /opt/hermes-agent \( -type d ! -perm -0005 \) -o \( -type f ! -perm -0004 \))
          if [ -n "$unreadable" ]; then
            echo "SMOKE-FAIL: not readable for other users:"
            head -n 20 <<<"$unreadable"
            exit 1
          fi
          # ... and writable only for root.
          writable=$(find /opt/hermes-agent ! -type l -perm -0002)
          if [ -n "$writable" ]; then
            echo "SMOKE-FAIL: writable for other users:"
            head -n 20 <<<"$writable"
            exit 1
          fi
          # Upstream's test suite stays out of /opt.
          if [ -e /opt/hermes-agent/tests ]; then
            echo "SMOKE-FAIL: /opt/hermes-agent/tests is packaged"
            exit 1
          fi
          # Without the prebuilt bundles the CLI would try an npm build in the
          # root-owned /opt tree.
          for f in hermes_cli/tui_dist/entry.js hermes_cli/tui_dist/package.json hermes_cli/web_dist/index.html; do
            if [ ! -s "/opt/hermes-agent/$f" ]; then
              echo "SMOKE-FAIL: /opt/hermes-agent/$f is missing"
              exit 1
            fi
          done
          if ! hermes --help > /tmp/hermes-help.log 2>&1; then
            echo "SMOKE-FAIL: hermes --help failed"
            tail -n 40 /tmp/hermes-help.log
            exit 1
          fi
          echo "SMOKE-OK: hermes ${pkgver} runs on $("$py" -c 'import platform; print("python", platform.python_version())') and answers --help"

      - name: pm resolves the system tools (fresh non-root user)
        run: |
          set -euo pipefail
          useradd -m smoke
          # As the launcher runs it: lazy installs off, so nothing may come
          # from a download.
          runuser -u smoke -- env HERMES_DISABLE_LAZY_INSTALLS=1 \
            /opt/hermes-agent/venv/bin/python -I - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from cron.scheduler_script import _posix_cron_script_argv
          from hermes_cli._launchers import installation_command, resolve_store_python, runtime_command
          from hermes_cli.gateway import generate_systemd_unit, get_python_path
          from hermes_cli.main_tui_launch import _tui_node_bin
          from hermes_cli.venv_sync import check_runtime
          from tools.mcp_tool_config import _managed_launcher, _resolve_stdio_command
          root = Path("/opt/hermes-agent")
          venv_python = "/opt/hermes-agent/venv/bin/python"
          store = "/opt/hermes-agent/system-store/tools/"
          problems = []
          # The startup check, which also puts pm's tool dirs on PATH.
          verdict = check_runtime(root)
          if verdict:
              problems.append(f"startup check: {verdict}")
          # Only node's and npm's store dirs go on PATH: others would shadow
          # the user's own python3/ffmpeg/rg for bare MCP commands.
          on_path = [p for p in os.environ["PATH"].split(os.pathsep) if p.startswith(store)]
          if sorted(Path(p).parent.name.split("-")[0] for p in on_path) != ["node", "npm"]:
              problems.append(f"store dirs on PATH: {on_path}")
          for command in ("python3", "ffmpeg", "rg"):
              resolved = _resolve_stdio_command(command, dict(os.environ))[0]
              if resolved.startswith(store):
                  problems.append(f"bare MCP {command} resolves into the store: {resolved}")
          # Hermes must keep running its children, cron scripts and service
          # units on the venv, never on the store python
          # (keep-venv-interpreter.patch). Checked where each path ends up,
          # so a new upstream reader of the store python shows up here.
          for publication in (False, True):
              python = resolve_store_python(root, publication=publication)
              if python is not None:
                  problems.append(f"store python (publication={publication}): {python}")
          interpreters = {
              "child command": runtime_command(root)[0],
              "installation command": installation_command(root)[0],
              "gateway python": get_python_path(),
              "cron script": _posix_cron_script_argv(Path("/tmp/job.py"))[0][0],
          }
          for what, python in interpreters.items():
              if python != venv_python:
                  problems.append(f"{what} runs on {python}")
          unit = generate_systemd_unit()
          if f'ExecStart="{venv_python}"' not in unit:
              exec_start = [line for line in unit.splitlines() if line.startswith("ExecStart=")]
              problems.append(f"gateway unit: {exec_start[:1]}")
          node = _tui_node_bin("node")
          if not node.startswith(store) or os.path.realpath(node) != os.path.realpath("/usr/bin/node"):
              problems.append(f"TUI node is {node}")
          for command in ("npx", "uvx"):
              launcher = _managed_launcher(command)
              if not launcher or not launcher[0].startswith(store):
                  problems.append(f"MCP {command} resolves to {launcher}")
                  continue
              run = subprocess.run([launcher[0], "--version"], capture_output=True, text=True,
                                   env={**os.environ, "PATH": os.pathsep.join([*launcher[1], os.environ["PATH"]])})
              if run.returncode != 0:
                  problems.append(f"MCP {command} --version failed: {run.stderr.strip()[:200]}")
          # Lazy installs are off, so an extra missing here stays missing for
          # users: pm must find each one installed, as the TTS, web search,
          # provider and gateway code asks for it.
          from pm import ensure_import
          for extra in ("anthropic", "edge-tts", "ddgs", "doc-extract", "feishu", "matrix",
                        "dingtalk", "wecom", "teams", "google-chat"):
              try:
                  ensure_import(extra)
              except Exception as exc:
                  problems.append(f"extra {extra}: {str(exc)[:200]}")
          if (Path.home() / ".hermes/tools").exists():
              problems.append("a per-user pm store was created")
          if problems:
              sys.exit("SMOKE-FAIL: " + "; ".join(problems))
          print(f"SYSTEM-TOOLS-OK: node {node}, npx/uvx run, children, cron and unit on the venv, extras installed")
          PY

      - name: Browser tools take a system browser (fresh non-root user)
        run: |
          set -euo pipefail
          # Stand-ins: this checks where hermes looks, not the browser itself.
          install -d -m 755 /tmp/fakebin
          for tool in agent-browser brave; do
            printf '#!/bin/sh\necho "%s 0.0.0"\n' "$tool" > "/tmp/fakebin/$tool"
          done
          chmod 755 /tmp/fakebin/*
          # The launcher exports the first system browser it finds and keeps
          # a value the user set. Run it up to its exec line.
          last='exec /opt/hermes-agent/venv/bin/python -m hermes_cli.main "$@"'
          if [ "$(tail -n 1 /usr/bin/hermes)" != "$last" ]; then
            echo "SMOKE-FAIL: the launcher no longer ends with: $last"
            exit 1
          fi
          { sed '$d' /usr/bin/hermes; echo 'printf "%s" "${AGENT_BROWSER_EXECUTABLE_PATH:-}"'; } > /tmp/launcher-env
          for case in "/tmp/fakebin/brave|" "/opt/own/browser|/opt/own/browser"; do
            want=${case%%|*} own=${case#*|}
            got=$(env PATH="/tmp/fakebin:$PATH" ${own:+AGENT_BROWSER_EXECUTABLE_PATH=$own} bash /tmp/launcher-env)
            if [ "$got" != "$want" ]; then
              echo "SMOKE-FAIL: launcher browser '$got', expected '$want'"
              exit 1
            fi
          done
          # Without pm's copy hermes takes agent-browser from PATH (the AUR
          # package), so a system browser needs no per-user download.
          runuser -u smoke -- env PATH="/tmp/fakebin:$PATH" HERMES_DISABLE_LAZY_INSTALLS=1 \
            /opt/hermes-agent/venv/bin/python -I -c '
          import sys
          from tools.browser_tool_install import _find_agent_browser
          found = _find_agent_browser(validate=False)
          if found != "/tmp/fakebin/agent-browser":
              sys.exit(f"SMOKE-FAIL: agent-browser resolves to {found}")
          print(f"BROWSER-OK: launcher picks a system browser, agent-browser from PATH ({found})")'

  # ---------------------------------------------------------------------------
  # Release + AUR sync: only after a merge to main or a manual dispatch ON main
  # (never from pull_request or another branch — no releases of unreviewed code).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.smoke.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: NousResearch/hermes-agent
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          UPSTREAM_COMMIT=$(grep -oP '(?<=^_commit=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # Previous upstream tag, for the compare link. Best effort only: never
          # fail the release because upstream's release list looks unexpected.
          PREV=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
                   | python3 -c 'import json,sys; t=[r["tag_name"] for r in json.load(sys.stdin)]; c=sys.argv[1]; i=t.index(c) if c in t else -1; print(t[i+1] if 0 <= i and i+1 < len(t) else "")' "$UPSTREAM" \
                   2>/dev/null || true)
          {
            printf 'Prebuilt Arch package `%s-%s`, re-wrapped from the upstream source tag `%s` — nothing is compiled at install time.\n\n' \
              "$PKGVER" "$PKGREL" "$UPSTREAM"
            printf -- '- [Upstream release %s](https://github.com/%s/releases/tag/%s)\n' \
              "$UPSTREAM" "$UPSTREAM_REPO" "$UPSTREAM"
            if [ -n "$PREV" ]; then
              printf -- '- [Upstream changes %s -> %s](https://github.com/%s/compare/%s...%s)\n' \
                "$PREV" "$UPSTREAM" "$UPSTREAM_REPO" "$PREV" "$UPSTREAM"
            else
              printf -- '- [Upstream changes](https://github.com/%s/releases)\n' "$UPSTREAM_REPO"
            fi
            # Every source patch of PKGBUILD, linked at the built commit.
            patches=$(sed -nE "s/^  '([^'/]+\.patch)'$/\1/p" PKGBUILD)
            if [ -n "$patches" ]; then
              printf -- '\nPatched upstream source:\n'
              for patch in $patches; do
                printf -- '- [%s](https://github.com/%s/blob/%s/%s)\n' \
                  "$patch" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$patch"
              done
            fi
            printf -- '\nUpstream commit: `%s`\nArtifact sha256: `%s`\n' \
              "$UPSTREAM_COMMIT" "$(sha256sum "$FILE" | cut -d' ' -f1)"
          } > /tmp/notes.md
          cat /tmp/notes.md
          # --target: tag the commit that was built, not whatever main is now.
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "hermes-agent-bin ${PKGVER}-${PKGREL}" \
            --notes-file /tmp/notes.md
          echo "Release created: $TAG"

  aur-sync:
    runs-on: ubuntu-latest
    needs: [plan, release]
    # Also after a push that skipped the release (version already released):
    # aur/ may have changed, and the artifact comes from the release anyway.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.release.result == 'success' || needs.plan.outputs.released == 'true') }}
    timeout-minutes: 10
    # Keep AUR_SSH_KEY as a secret of this environment, restricted to main
    # (Settings → Environments): pull requests from branches of this
    # repository can read repository-level secrets.
    environment: aur
    # One publisher at a time; the main-HEAD check below drops stale runs.
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute release artifact sha256 and pin it into aur/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          FILE="hermes-agent-bin-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          # Authenticated download: also works in a private copy of this repo.
          gh release download "v${PKGVER}-${PKGREL}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILE" --output /tmp/pkg.pkg.tar.zst
          SHA=$(sha256sum /tmp/pkg.pkg.tar.zst | cut -d' ' -f1)
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${SHA}\2|" aur/PKGBUILD
          sed -i -E "s|^([[:space:]]*sha256sums = )[0-9a-f]{64}|\1${SHA}|" aur/.SRCINFO
          # sed succeeds even when nothing matched: never publish a stale sum.
          grep -qx "sha256sums=('${SHA}')" aur/PKGBUILD
          grep -qxP "\tsha256sums = ${SHA}" aur/.SRCINFO
          echo "artifact sha256=${SHA}"

      - name: Push aur/ to AUR git (publish; dry run in copies of this repo)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # A slower run for an older commit must not overwrite what a newer
          # main has already published.
          MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN" != "$GITHUB_SHA" ]; then
            echo "main moved on to ${MAIN}; not publishing ${GITHUB_SHA}"
            exit 0
          fi
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_KEY is empty — store the AUR key as a secret of the aur environment"
            exit 1
          fi
          git config --global user.name "hermes-agent-bin CI"
          git config --global user.email "jabla@users.noreply.github.com"
          rm -rf /tmp/aur
          # Only the canonical repository publishes. Copies (forks, a CI test
          # repository) clone the public AUR repository read-only and show the
          # diff they would push.
          if [ "$GITHUB_REPOSITORY" = jabla/hermes-agent-bin ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ci && chmod 600 ~/.ssh/aur_ci
            ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes"
            git clone ssh://aur@aur.archlinux.org/hermes-agent-bin.git /tmp/aur
          else
            git clone https://aur.archlinux.org/hermes-agent-bin.git /tmp/aur
          fi
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          # Stage first: git diff alone ignores untracked files, so a fresh
          # (empty) AUR repo would falsely report "nothing to push" and never
          # create the initial commit.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package up to date, nothing to push"
          elif [ "$GITHUB_REPOSITORY" != jabla/hermes-agent-bin ]; then
            echo "DRY RUN in ${GITHUB_REPOSITORY}: would push ${PKGVER}-${PKGREL} to the AUR:"
            git diff --cached
          else
            git commit -m "Update to ${PKGVER}-${PKGREL}"
            git push origin master
            echo "AUR updated to ${PKGVER}-${PKGREL}"
          fi
